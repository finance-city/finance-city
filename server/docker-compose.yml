version: '3.8'

services:
  # ==========================================
  # 데이터 저장소
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: finance_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

  # ==========================================
  # 데이터 수집 서비스
  # ==========================================
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: finance_collector
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    ports:
      - "8090:8090"  # Prometheus metrics endpoint
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - finance_network
    volumes:
      - ./collector/logs:/app/logs

  # ==========================================
  # 스트리밍 서비스
  # ==========================================
  streamer:
    build:
      context: ./streamer
      dockerfile: Dockerfile
    container_name: finance_streamer
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - NODE_ENV=production
    ports:
      - "${WS_PORT:-8081}:8081"
      - "${HEALTH_PORT:-8082}:8082"
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # Observability - Metrics Collection
  # ==========================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: finance_redis_exporter
    command:
      - '--redis.addr=redis:6379'
    ports:
      - "9121:9121"
    depends_on:
      - redis
    restart: always
    networks:
      - finance_network

  prometheus:
    image: prom/prometheus:latest
    container_name: finance_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'  # 7일간 데이터 보관
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'  # API를 통한 설정 리로드 가능
    ports:
      - "9090:9090"  # 표준 포트 사용
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - collector
      - streamer
      - redis-exporter
    restart: always
    networks:
      - finance_network

  grafana:
    image: grafana/grafana:latest
    container_name: finance_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=  # 필요한 플러그인 추가 가능
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
    networks:
      - finance_network

networks:
  finance_network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data: