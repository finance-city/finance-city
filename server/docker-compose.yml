version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: kis_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - finance_network

networks:
  finance_network:
    driver: bridge

volumes:
  redis_data: