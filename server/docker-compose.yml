version: '3.8'

services:
  # ==========================================
  # 데이터 저장소
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: finance_redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance_network

  # ==========================================
  # 데이터 수집 서비스
  # ==========================================
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: finance_collector
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=stock:realtime
      - KIS_APPKEY=${KIS_APPKEY}
      - KIS_APPSECRET=${KIS_APPSECRET}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - finance_network
    volumes:
      - ./collector/logs:/app/logs

  # ==========================================
  # 스트리밍 서비스
  # ==========================================
  streamer:
    build:
      context: ./streamer
      dockerfile: Dockerfile
    container_name: finance_streamer
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CHANNEL=stock:realtime
      - WS_PORT=8081
      - HEALTH_PORT=8082
      - MAX_CONNECTIONS=1000
      - FLUSH_INTERVAL_MS=100
      - LOG_LEVEL=info
      - NODE_ENV=production
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    networks:
      - finance_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  finance_network:
    driver: bridge

volumes:
  redis_data: